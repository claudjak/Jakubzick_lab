<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research | Jakubzick Lab</title>
<meta name="description" content="Research in the Jakubzick Lab: mononuclear phagocyte subsets across mouse and human tissues, the yin and yang of macrophages and monocytes in inflammation and cancer, and natural antibodies in cancer immune surveillance.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..600,0..100;1,9..144,300..600,0..100&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<meta property="og:site_name" content="Jakubzick Lab">
<meta property="og:title" content="Research | Jakubzick Lab">
<meta property="og:description" content="Mononuclear phagocytes across species, macrophages in inflammation and cancer, and natural antibodies in cancer immune surveillance.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://claudjak.github.io/Jakubzick_lab/research.html">
<meta property="og:image" content="https://claudjak.github.io/Jakubzick_lab/assets/og.jpg">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://claudjak.github.io/Jakubzick_lab/assets/og.jpg">
<link rel="canonical" href="https://claudjak.github.io/Jakubzick_lab/research.html">
<link rel="icon" href="assets/favicon.svg?v=1" type="image/svg+xml"><link rel="alternate icon" href="assets/favicon-32.png?v=1" sizes="32x32"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=1">
<link rel="stylesheet" href="assets/app.css?v=1">
<style>
  .head-hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 2rem; align-items: center; margin-bottom: 1rem; }
  .head-hero .page-head { margin-bottom: .8rem; }
  .head-hero .hero-canvas-wrap { aspect-ratio: 1 / 1; width: 100%; max-width: 520px; margin: 0 auto; }
  @media (max-width: 860px) { .head-hero { grid-template-columns: 1fr; } .head-hero .hero-canvas-wrap { max-width: 380px; } }
</style>
</head>
<body>
<div id="site-header"></div>
<main class="wrap">
  <div class="head-hero">
    <div>
      <div class="page-head">
        <p class="eyebrow">Research</p>
        <h1>Research</h1>
        <p id="intro"></p>
      </div>
      <nav class="theme-nav" id="themenav" aria-label="Research themes"></nav>
    </div>
    <div class="hero-canvas-wrap" role="img" aria-label="An interactive field of immune cells that respond to the cursor"><canvas id="hero-canvas"></canvas></div>
  </div>
  <div class="with-sidenav">
    <aside class="sidenav" id="sidenav" aria-label="Jump to a theme"></aside>
    <div id="themes"><div class="spinner">Loading…</div></div>
  </div>
</main>
<div id="site-footer"></div>
<script src="assets/config.js?v=1"></script>
<script src="assets/app.js?v=1"></script>
<script src="assets/layout.js?v=1"></script>
<script src="assets/hero.js?v=1"></script>
<script>
(async function () {
  const r = await CL.getJSON("data/research.json");
  const esc = CL.esc;
  document.getElementById("intro").textContent = r.intro;
  document.getElementById("themenav").innerHTML = r.themes.map(t => `<a href="#${esc(t.id)}">${esc(t.title)}</a>`).join("");
  // link each theme to the matching publication tags
  const TAGS = { "cross-species": "topic=cross_species&approach=single_cell_spatial,transcriptomics", "yin-yang": "topic=cancer_immunity,inflammation_damage", "natural-antibodies": "topic=natural_antibodies" };
  const ov = r.overview ? `<section class="theme rv" id="overview"><div><p class="eyebrow">Background</p><h2>${esc(ov_title(r))}</h2>${r.overview.paragraphs.map(p => `<p>${esc(p)}</p>`).join("")}</div><figure><img src="assets/img/lab-photo-2024.jpg" alt="The Jakubzick lab in 2024" loading="lazy"></figure></section>` : "";
  function ov_title(r) { return r.overview.title; }
  document.getElementById("themes").innerHTML = ov + r.themes.map((t, i) => `<section class="theme${i % 2 ? "" : " flip"} rv" id="${esc(t.id)}">
      <div>
        <p class="eyebrow">Theme ${i + 1}</p>
        <h2>${esc(t.title)}</h2>
        ${t.question ? `<p class="q">${esc(t.question)}</p>` : ""}
        ${t.paragraphs.map(p => `<p>${esc(p)}</p>`).join("")}
        ${TAGS[t.id] ? `<a class="papers-link" href="publications.html?${TAGS[t.id]}">Related publications →</a>` : ""}
      </div>
      ${t.image ? `<figure><a href="assets/img/${esc(t.image)}" target="_blank" rel="noopener"><img src="assets/img/${esc(t.image)}" alt="Figure illustrating ${esc(t.title)}" loading="lazy"></a>${t.image_caption ? `<figcaption class="small muted">${esc(t.image_caption)}</figcaption>` : ""}</figure>` : `<figure class="placeholder" style="border:none;box-shadow:none;background:none"></figure>`}
    </section>`).join("");
  CL.sideNav(document.getElementById("sidenav"), [{ id: "overview", label: "Background" }].concat(r.themes.map(t => ({ id: t.id, label: t.title }))), "On this page");
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const rvs = document.querySelectorAll("#themes .rv");
  if (reduce || !("IntersectionObserver" in window)) rvs.forEach(el => el.classList.add("in"));
  else { const io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); } }), { threshold: 0.08 }); rvs.forEach(el => io.observe(el)); }
  if (location.hash) { const el = document.querySelector(location.hash); if (el) setTimeout(() => el.scrollIntoView({ block: "start" }), 50); }
})().catch(e => { document.getElementById("themes").innerHTML = `<div class="empty">Could not load (${CL.esc(e.message)}).</div>`; });
</script>
</body>
</html>
